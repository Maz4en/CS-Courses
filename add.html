<html>
	<head><link rel="stylesheet" href="style.css">
	<title>
		Add Courses
	</title>
	<style>
		.add {
			background-color: #00b7ff;
			color: #000;
		}
	</style>
</head>
	<body>
	<header>
			<div class="main-header">
				<a href="index.html"><h1><span>CS</span> Courses</h1></a>
			</div>			
			<nav>
				<ul>
					<li><a class="add" href="add.html">Add Courses</a></li>
					<li><a class="course" href="course.html">My Courses</a></li>
					<li class="hover"><a class="contact" href="contact.html">Contact Us</a></li>				</ul>
			</nav>
		</header>

		<main>
			<section>
				<h1><span style="color: rgb(0, 183, 255);">Add</span> Courses</h1><br>
				<p>Now you can fill out the form and choose courses you need</p>
				<form action="course.html">
					<img src="images/image.png" alt="form-icon" class="form-icon"><br>
					<label for="cInstructor">Instructor</label><br>
					<input type="text" id="cInstructor" name="cInstructor" placeholder="Instructor Name"><br>

					<label for="cName">Course Name</label></br>
					<select>
						<option name="CS">CS</option>
						<option name="IT">IT</option>
						<option name="Mat">Math</option>
						<option name="Sta">Stat</option>
						<option name="ELc">Electronics</option>
					</select><br>
					

					<label for="cHours">Credit Hours</label></br>
					<input type="number" min="2" max="4" id="cHours" name="cHours" placeholder="Credit Hours">
					
					<br><label for="cNotes">Notes</label><br>
					<textarea placeholder="Notes"></textarea>
					
					<br><button value="Submit">Submit</button>
				</form>
			</section>
		</main>
		<footer>
		All Rights Reserved To <span style="color: rgb(0, 183, 255);">CS</span> Courses &copy; 2026
		</footer>
	</body>
</html>
